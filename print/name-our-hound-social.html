<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Name Our New Hound (social)</title>
<!--
  1080x1350 (4:5) social graphic for the hound naming auction; bidding closes Fri Nov 13, 2026, 8 pm.
  Same layout family as opening-hunt-2026-social.html. No current-bid figure, so it never goes stale.
  Not deployed. Render with headless Chrome:
    chrome --headless=new --hide-scrollbars --window-size=1080,1350 --screenshot=name-our-hound-social.png name-our-hound-social.html
-->
<link rel="stylesheet" href="../netlify-site/colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,700&family=Source+Sans+3:wght@300;400;600;700;800&display=swap">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--sfh-cream); }
.card {
  position: relative; width: 1080px; height: 1350px; overflow: hidden;
  background: var(--sfh-cream);
  font-variant-numeric: lining-nums;
}
.frame { position: absolute; inset: 22px; border: 3px solid var(--sfh-gold-400); }
.photo {
  position: absolute; left: 52px; top: 52px; width: 976px; height: 620px;
  border: 2px solid var(--sfh-navy-900); overflow: hidden;
}
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; display: block; }
.splash {
  position: absolute; left: 52px; top: 672px; width: 976px; height: 84px;
  background: var(--sfh-navy-900);
  border-top: 4px solid var(--sfh-gold-400);
  display: flex; align-items: center; justify-content: center; gap: 24px;
}
.splash-day {
  font-family: var(--font-sans); font-weight: 800; font-size: 30px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--sfh-gold-300); line-height: 1;
}
.splash-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sfh-gold-400); }
.splash-date {
  font-family: 'Libre Caslon Text', Georgia, serif; font-weight: 700; font-size: 36px;
  color: var(--sfh-cream); line-height: 1;
}
.text { position: absolute; left: 52px; right: 52px; top: 784px; text-align: center; }
.eyebrow {
  font-family: var(--font-sans); font-weight: 700; font-size: 20px;
  letter-spacing: 0.24em; color: var(--sfh-navy-500); text-transform: uppercase;
}
h1 {
  margin: 10px 0 0; font-family: 'Libre Caslon Text', Georgia, serif;
  font-style: italic; font-weight: 700; font-size: 76px; line-height: 1.05;
  color: #1c1712;
}
.sub {
  margin-top: 10px; font-family: 'Libre Caslon Text', Georgia, serif; font-size: 29px; color: #4a4339;
}
.rule { width: 140px; height: 3px; background: var(--sfh-gold-400); margin: 20px auto 0; }
.order { margin-top: 24px; display: flex; justify-content: center; }
.step { width: 280px; padding: 0 10px; }
.step + .step { border-left: 1px solid var(--sfh-gold-400); }
.step-big {
  font-family: 'Libre Caslon Text', Georgia, serif; font-weight: 700; font-size: 44px;
  color: var(--sfh-navy-900); line-height: 1.1;
}
.step-what {
  margin-top: 6px; font-family: var(--font-sans); font-weight: 600; font-size: 19px;
  letter-spacing: 0.08em; text-transform: uppercase; color: #3a352e;
}
.footer-rule { position: absolute; left: 52px; right: 52px; top: 1180px; height: 2px; background: var(--sfh-gold-400); }
.logo { position: absolute; left: 46px; top: 1184px; width: 150px; height: 134px; object-fit: contain; }
.cta { position: absolute; right: 58px; top: 1214px; text-align: right; }
.cta-label {
  font-family: var(--font-sans); font-weight: 700; font-size: 17px; letter-spacing: 0.24em;
  color: var(--sfh-gold-600); text-transform: uppercase;
}
.cta-url { margin-top: 8px; font-family: var(--font-sans); font-weight: 700; font-size: 31px; color: var(--sfh-navy-900); }
</style>
</head>
<body>
<div class="card">
  <div class="frame"></div>
  <div class="photo"><img src="../netlify-site/assets/photos/hound-j-portrait.jpg" alt=""></div>
  <div class="splash"><span class="splash-day">Bidding Closes</span><span class="splash-dot"></span><span class="splash-date">Friday, November 13 · 8 pm</span></div>
  <div class="text">
    <div class="eyebrow">Naming Auction · Highest Bid Wins</div>
    <h1>Name Our New Hound</h1>
    <div class="sub">She's waiting for a name that starts with J</div>
    <div class="rule"></div>
    <div class="order">
      <div class="step"><div class="step-big">$150</div><div class="step-what">Opening Bid</div></div>
      <div class="step"><div class="step-big">$25</div><div class="step-what">Increments</div></div>
      <div class="step"><div class="step-big">J</div><div class="step-what">Her First Letter</div></div>
    </div>
  </div>
  <div class="footer-rule"></div>
  <img class="logo" src="logo-transparent.png" alt="Santa Fe Hunt">
  <div class="cta">
    <div class="cta-label">Place Your Bid At</div>
    <div class="cta-url">santafehunt.com/name-our-hound</div>
  </div>
</div>
</body>
</html>
